name: Cell Design Labs
description: 'Cell Design Labs, Inc. was a biotherapeutics company based at 5858 Horton Street, Emeryville,
  California, that engineered immune cells into "smart, living therapies" for cancer and other diseases.
  Its platform was a toolkit of proprietary molecular modules — including synthetic Notch (synNOTCH) receptors
  and programmable, combinatorial-antigen CAR-T circuits developed out of Wendell Lim''s lab at UCSF — deployed
  inside an immune cell to program its specificity and control its killing force, so a therapy recognizes
  a disease signature and neutralizes it without harming adjacent tissue. The company ran an exclusive research
  collaboration with Kite Pharma (announced June 2016) on molecular on/off switches for CAR T-cell immunotherapies,
  and was acquired by Gilead Sciences, announced 7 December 2017. Cell Design Labs no longer operates as
  an independent company: celldesignlabs.com is dead (DNS resolves to a parked address, HTTP times out;
  the archived site shows an expired Squarespace subscription). It published no developer program, API,
  documentation, SDK, or GitHub organization, and none exists to enrich.'
